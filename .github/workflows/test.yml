name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build container image
        run: podman build -t ia-fil-toolbox .

      - name: run tests
        run: |
          podman run --rm \
            --entrypoint bash \
            ia-fil-toolbox \
            -c "cd /app && uv run python test_pipeline.py"
